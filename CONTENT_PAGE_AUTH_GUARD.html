<!-- ═══════════════════════════════════════════════════════════
     AUTH GUARD — paste this snippet at the TOP of <body> in each
     protected content page (youtube-automation.html, etc.)
     
     This is a client-side fallback. The real protection is middleware.js.
     ═══════════════════════════════════════════════════════════ -->

<!-- Page content is hidden until auth check completes -->
<style>#page-content { visibility: hidden; }</style>

<script>
(async function authGuard() {
  try {
    const res = await fetch('/api/auth/me');
    if (res.ok) {
      const user = await res.json();
      // Show content
      document.getElementById('page-content').style.visibility = 'visible';
      // Optionally show user's avatar/name in nav
      const chip = document.getElementById('nav-user-chip');
      if (chip) {
        document.getElementById('nav-avatar').src = user.avatar
          ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.webp?size=48`
          : `https://cdn.discordapp.com/embed/avatars/0.png`;
        document.getElementById('nav-username').textContent = user.username;
        chip.style.display = 'flex';
      }
    } else {
      // Not logged in — redirect to home with login modal
      window.location.href = '/?login=1';
    }
  } catch {
    window.location.href = '/?login=1';
  }
})();
</script>

<!-- Wrap all your existing page content in this div -->
<div id="page-content">
  <!-- ... existing page HTML goes here ... -->
</div>
